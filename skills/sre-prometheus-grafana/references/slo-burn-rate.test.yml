# promtool unit tests for slo-burn-rate.rules.yml (generated by scripts/gen-burn-rate-rules.py,
# SLO example-availability, objective 0.999, period 30d).
# Format: https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/ (Prometheus 3.x, fetched 2026-10-16)
# Run: promtool test rules slo-burn-rate.test.yml
# Input series are scraped every 1m. Request rate is 100 req/min unless noted.
rule_files:
  - slo-burn-rate.rules.yml
evaluation_interval: 1m

tests:
  # 1. Healthy: 0.05% errors (0.5x burn). Nothing fires.
  - name: healthy-no-alerts
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+1999x300'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+1x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 4h
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts: []

  # 2. Fast burn: 5% errors (50x). Page fires on the 1h/5m tier; ticket tiers also match.
  - name: fast-burn-pages
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+95x120'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+5x120'
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{job="example-svc",slo="example-availability"}'
            value: 0.05
      # The responder query from sre-slo-alerting returns the burn rate (0.05 / 0.001 = 50x, float rounding).
      - expr: slo:sli_error:ratio_rate5m{slo="example-availability"} / (1 - 0.999)
        eval_time: 10m
        exp_samples:
          - labels: '{job="example-svc",slo="example-availability"}'
            value: 4.999999999999996E+01
    alert_rule_test:
      - eval_time: 10m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: {job: example-svc, slo: example-availability, severity: page}
            exp_annotations:
              summary: "SLO example-availability error budget burn (page)"
              description: "Error ratio is above the burn-rate threshold (14.4x over 1h/5m, 6x over 6h/30m; objective 0.999, period 30d). Long-window error ratio of the first matching tier: 5%."
              runbook_url: "https://runbooks.example.com/slo/example-availability"

  # 3. Slow burn: 0.5% errors (5x). Below both page thresholds (1.44%, 0.6%), above 3x (0.3%): ticket only.
  - name: slow-burn-ticket-only
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+199x200'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+1x200'
    alert_rule_test:
      - eval_time: 150m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 150m
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels: {job: example-svc, slo: example-availability, severity: ticket}
            exp_annotations:
              summary: "SLO example-availability error budget burn (ticket)"
              description: "Error ratio is above the burn-rate threshold (3x over 1d/2h, 1x over 3d/6h; objective 0.999, period 30d). Long-window error ratio of the first matching tier: 0.5%."
              runbook_url: "https://runbooks.example.com/slo/example-availability"

  # 4. Reset: 5% errors for 60m, then none. The short windows stop the page soon after
  #    recovery even though the 1h/6h windows are still above threshold.
  - name: page-resets-after-recovery
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+95x60 5700+100x60'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+5x60 300+0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: {job: example-svc, slo: example-availability, severity: page}
            exp_annotations:
              summary: "SLO example-availability error budget burn (page)"
              description: "Error ratio is above the burn-rate threshold (14.4x over 1h/5m, 6x over 6h/30m; objective 0.999, period 30d). Long-window error ratio of the first matching tier: 5%."
              runbook_url: "https://runbooks.example.com/slo/example-availability"
      - eval_time: 100m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []

  # 5. Very slow burn: 0.15% errors (1.5x). Only the 3d/6h tier (1x = 0.1%) matches.
  - name: very-slow-burn-3d-tier
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+1997x480'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+3x480'
    alert_rule_test:
      - eval_time: 7h
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 7h
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels: {job: example-svc, slo: example-availability, severity: ticket}
            exp_annotations:
              summary: "SLO example-availability error budget burn (ticket)"
              description: "Error ratio is above the burn-rate threshold (3x over 1d/2h, 1x over 3d/6h; objective 0.999, period 30d). Long-window error ratio of the first matching tier: 0.15%."
              runbook_url: "https://runbooks.example.com/slo/example-availability"

  # 6. Only the 14.4x 1h/5m tier: 6h clean, then 2% errors for 1h.
  #    At 7h: 1h ~= 2% (> 1.44%), 6h ~= 0.33% (< 0.6%). Catches a wrong 14.4x threshold.
#    1.967% (not 2%) because the 1h window straddles the step change (rate() extrapolation,
#    Prometheus 3.x left-open ranges: https://prometheus.io/docs/prometheus/latest/migration/).
  - name: fast-tier-only
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+100x360 36000+98x60'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+0x360 0+2x60'
    alert_rule_test:
      - eval_time: 7h
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: {job: example-svc, slo: example-availability, severity: page}
            exp_annotations:
              summary: "SLO example-availability error budget burn (page)"
              description: "Error ratio is above the burn-rate threshold (14.4x over 1h/5m, 6x over 6h/30m; objective 0.999, period 30d). Long-window error ratio of the first matching tier: 1.967%."
              runbook_url: "https://runbooks.example.com/slo/example-availability"

  # 7. Only the 6x 6h/30m tier: 1% errors sustained (10x). 1h = 1% (< 1.44%), 6h = 1% (> 0.6%).
  - name: six-hour-tier-only
    interval: 1m
    input_series:
      - series: 'http_requests_total{job="example-svc",code="200"}'
        values: '0+99x420'
      - series: 'http_requests_total{job="example-svc",code="500"}'
        values: '0+1x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: {job: example-svc, slo: example-availability, severity: page}
            exp_annotations:
              summary: "SLO example-availability error budget burn (page)"
              description: "Error ratio is above the burn-rate threshold (14.4x over 1h/5m, 6x over 6h/30m; objective 0.999, period 30d). Long-window error ratio of the first matching tier: 1%."
              runbook_url: "https://runbooks.example.com/slo/example-availability"
