# Lab Prometheus for docs/examples/05-slo-burn-rate-alerting.md (host network, loopback only).
global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [/etc/prometheus/slo-checkout.rules.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["127.0.0.1:59093"]}]}]
scrape_configs:
  - job_name: checkout
    static_configs: [{targets: ["127.0.0.1:59100"]}]
