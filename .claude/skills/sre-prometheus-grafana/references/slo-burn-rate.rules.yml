# Generated by gen-burn-rate-rules.py: SLO example-availability, objective 0.999, period 30d.
# Multiwindow multi-burn-rate rules per https://sre.google/workbook/alerting-on-slos/ (Table 5-8).
# Rule format: https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/ (Prometheus 3.x).
# Verified 2026-10-16 with promtool 3.15.0. Validate: promtool check rules --lint=all --lint-fatal <this file>
groups:
  - name: slo-example-availability
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[5m]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[5m]))
        labels:
          slo: "example-availability"
      - record: slo:sli_error:ratio_rate30m
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[30m]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[30m]))
        labels:
          slo: "example-availability"
      - record: slo:sli_error:ratio_rate1h
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[1h]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[1h]))
        labels:
          slo: "example-availability"
      - record: slo:sli_error:ratio_rate2h
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[2h]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[2h]))
        labels:
          slo: "example-availability"
      - record: slo:sli_error:ratio_rate6h
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[6h]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[6h]))
        labels:
          slo: "example-availability"
      - record: slo:sli_error:ratio_rate1d
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[1d]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[1d]))
        labels:
          slo: "example-availability"
      - record: slo:sli_error:ratio_rate3d
        expr: |
          sum by (job) (rate(http_requests_total{job="example-svc",code=~"5.."}[3d]))
          /
          sum by (job) (rate(http_requests_total{job="example-svc"}[3d]))
        labels:
          slo: "example-availability"
      - alert: SLOErrorBudgetBurnFast
        expr: |
          (
            slo:sli_error:ratio_rate1h{slo="example-availability"} > (14.4 * 0.001)
          and
            slo:sli_error:ratio_rate5m{slo="example-availability"} > (14.4 * 0.001)
          )
          or
          (
            slo:sli_error:ratio_rate6h{slo="example-availability"} > (6 * 0.001)
          and
            slo:sli_error:ratio_rate30m{slo="example-availability"} > (6 * 0.001)
          )
        labels:
          severity: page
          slo: "example-availability"
        annotations:
          summary: "SLO example-availability error budget burn (page)"
          description: "Error ratio is above the burn-rate threshold (14.4x over 1h/5m, 6x over 6h/30m; objective 0.999, period 30d). Long-window error ratio of the first matching tier: {{ $value | humanizePercentage }}."
          runbook_url: "https://runbooks.example.com/slo/example-availability"
      - alert: SLOErrorBudgetBurnSlow
        expr: |
          (
            slo:sli_error:ratio_rate1d{slo="example-availability"} > (3 * 0.001)
          and
            slo:sli_error:ratio_rate2h{slo="example-availability"} > (3 * 0.001)
          )
          or
          (
            slo:sli_error:ratio_rate3d{slo="example-availability"} > (1 * 0.001)
          and
            slo:sli_error:ratio_rate6h{slo="example-availability"} > (1 * 0.001)
          )
        labels:
          severity: ticket
          slo: "example-availability"
        annotations:
          summary: "SLO example-availability error budget burn (ticket)"
          description: "Error ratio is above the burn-rate threshold (3x over 1d/2h, 1x over 3d/6h; objective 0.999, period 30d). Long-window error ratio of the first matching tier: {{ $value | humanizePercentage }}."
          runbook_url: "https://runbooks.example.com/slo/example-availability"
