name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated outputs are up to date
        run: python3 scripts/build-targets.py --check
      - name: Pack structure, frontmatter, links, JSON/YAML/TOML
        run: |
          pip install pyyaml
          python3 scripts/validate.py
      - name: Validator fixture tests
        run: python3 scripts/tests/test_validate.py
      - name: Shell syntax and shellcheck
        run: |
          find .claude -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find .claude -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: PagerDuty/Opsgenie script tests
        run: bash .claude/skills/sre-pagerduty-opsgenie/scripts/tests/run_tests.sh
      - name: Expiry audit script tests
        run: bash .claude/skills/sre-expiry-audit/scripts/tests/run_tests.sh
      - name: Database triage script tests
        working-directory: .claude/skills/sre-database-triage
        run: bash tests/run-tests.sh
      - name: Migration safety tests
        run: python3 .claude/skills/sre-migration-safety/scripts/tests/test_lint.py
      - name: Kubernetes upgrade autopilot tests
        run: bash .claude/skills/sre-k8s-upgrade-autopilot/tests/run-tests.sh
      - name: Install promtool
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz | tar xz -C /tmp
          echo "PROMTOOL=/tmp/prometheus-3.5.0.linux-amd64/promtool" >> "$GITHUB_ENV"
      - name: Burn-rate rule generator tests
        run: bash .claude/skills/sre-prometheus-grafana/scripts/test-gen-burn-rate-rules.sh
      - name: Observability cost cutter tests
        run: REQUIRE_PROMTOOL=1 python3 .claude/skills/sre-observability-cost-cutter/scripts/tests/run_tests.py
      - name: PromQL snippets
        run: |
          PATH=/tmp/prometheus-3.5.0.linux-amd64:$PATH python3 .claude/skills/sre-prometheus-grafana/scripts/validate-promql-snippets.py \
            $(grep -rl --include='*.md' '```promql' .claude)

  terraform-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Terraform scripts and guard hook tests (terraform 1.16+)
        working-directory: .claude/skills/sre-terraform
        run: bash tests/run-tests.sh

  bash32:
    # macOS ships bash 3.2 as /bin/bash; keeps every script 3.2-compatible.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Put /bin/bash (3.2) first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/b32" && ln -s /bin/bash "$RUNNER_TEMP/b32/bash"
          echo "$RUNNER_TEMP/b32" >> "$GITHUB_PATH"
      - name: Confirm bash 3.2
        run: bash -c 'echo "$BASH_VERSION"; [[ $BASH_VERSION == 3.2* ]]'
      - name: Show jq version
        run: jq --version
      - name: Syntax check with bash 3.2
        run: find .claude -name '*.sh' -print0 | xargs -0 -n1 /bin/bash -n
      - name: PagerDuty/Opsgenie tests on bash 3.2
        run: bash .claude/skills/sre-pagerduty-opsgenie/scripts/tests/run_tests.sh
      - name: Expiry audit tests on bash 3.2
        run: bash .claude/skills/sre-expiry-audit/scripts/tests/run_tests.sh
      - name: Database triage tests on bash 3.2
        working-directory: .claude/skills/sre-database-triage
        run: bash tests/run-tests.sh
      - name: Kubernetes upgrade autopilot tests on bash 3.2
        run: bash .claude/skills/sre-k8s-upgrade-autopilot/tests/run-tests.sh
      - name: Terraform tests on bash 3.2
        working-directory: .claude/skills/sre-terraform
        run: bash tests/run-tests.sh
